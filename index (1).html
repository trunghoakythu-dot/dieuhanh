<style>
/* Layout: a single phone column, deep-sea navy header with the silver 珍 plate and wave lines from Jenny's logo, bottom tab bar */
:root{
  --ground:#e9e4da; --paper:#fbf8f2; --ink:#14233d; --muted:#6b6f7a; --line:#ddd5c6;
  --lacquer:#0c2147; --gold:#2f6fa3; --gold-soft:#e2edf7; --seal:#b3261e; --seal-soft:#f6dedb;
  --ok:#2d6a4f; --ok-soft:#dcefe3; --warn:#9a5b00; --warn-soft:#fbedd2; --jade:#2f6f6a;
  --motif:rgba(15,61,110,.085); --metal1:#2f6fa3; --metal2:#9fb8cf; --metal3:#73c4ec;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-seal:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0b1424; --paper:#121e33; --ink:#ece6da; --muted:#a3a9b6; --line:#263553;
  --lacquer:#07132b; --gold:#7cc3ea; --gold-soft:#16304f; --seal:#e0675d; --seal-soft:#3d1f1e;
  --ok:#7fcfa2; --ok-soft:#173a2c; --warn:#f0c46a; --warn-soft:#3b3020; --jade:#7cc4bd; --motif:rgba(140,195,235,.12); --metal1:#ffffff; --metal2:#c9d6e3; --metal3:#9fdcf5; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0b1424; --paper:#121e33; --ink:#ece6da; --muted:#a3a9b6; --line:#263553;
  --lacquer:#07132b; --gold:#7cc3ea; --gold-soft:#16304f; --seal:#e0675d; --seal-soft:#3d1f1e;
  --ok:#7fcfa2; --ok-soft:#173a2c; --warn:#f0c46a; --warn-soft:#3b3020; --jade:#7cc4bd; --motif:rgba(140,195,235,.12); --metal1:#ffffff; --metal2:#c9d6e3; --metal3:#9fdcf5; color-scheme:dark}
*{box-sizing:border-box}
:root{--card:color-mix(in srgb,var(--paper) 84%,transparent)}
#motif{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0f3b6e}
.app{max-width:480px;margin:0 auto;min-height:100%;background:transparent;position:relative;z-index:1;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
header{background:var(--lacquer);color:#eef4fa;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
header{background:radial-gradient(120% 140% at 15% 0%,#17639a 0%,#0f3b6e 45%,#0c2147 100%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:22px;background:no-repeat center/100% 100% url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 22%27 preserveAspectRatio=%27none%27%3E%3Cpath d=%27M0 8 C100 2 200 14 300 7 S400 6 400 6%27 fill=%27none%27 stroke=%27%2373c4ec%27 stroke-width=%271.2%27/%3E%3Cpath d=%27M0 18 C120 12 220 22 320 16 S400 15 400 15%27 fill=%27none%27 stroke=%27%2373c4ec%27 stroke-opacity=%27.6%27 stroke-width=%271%27/%3E%3C/svg%3E");opacity:.85}
.hrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:50px;height:50px;flex:none;border-radius:11px;display:block}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fcdf0}
.hello{font-family:var(--f-disp);font-size:24px;font-weight:600;margin:2px 0 0;text-wrap:balance}
.date{font-size:13px;color:#b9cde0;margin-top:10px;position:relative;z-index:1}
.snap{font-size:11px;color:#8fa9c2}
main{flex:1;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
h2{font-family:var(--f-disp);font-size:19px;font-weight:600;margin:0}
.sec{display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h .small{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;background:var(--card)}
.stat b{display:block;font-family:var(--f-disp);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.stat.red{border-color:var(--seal);background:var(--seal-soft)} .stat.red b{color:var(--seal)}
.stat.gold b{color:var(--gold)}
.list{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.it:first-child{border-top:0}
.d{text-align:center;line-height:1}
.d b{display:block;font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.d span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.it .t{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.it .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-red{background:var(--seal-soft);color:var(--seal)} .p-amber{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)}
.p-gold{background:var(--gold-soft);color:var(--gold)} .p-grey{background:var(--line);color:var(--muted)} .p-jade{background:var(--ok-soft);color:var(--jade)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-size:13.5px;text-align:center}
.segs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px var(--f-body);cursor:pointer}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ag{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ag>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px;cursor:pointer;background:var(--card)}
.ag>button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.ag .nm{font-weight:700;font-size:15px}
.ag .sub{font-size:12.5px;color:var(--muted);grid-column:1}
.ag .num{grid-row:1/3;grid-column:2;text-align:right;align-self:center}
.ag .num b{font-family:var(--f-disp);font-size:24px;display:block;line-height:1}
.ag .num span{font-size:11px;color:var(--muted)}
.ag .rows{border-top:1px solid var(--line)}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line);grid-column:1/-1;margin-top:4px}
.bar i{display:block;height:100%}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pipe div{border-radius:10px;padding:8px 6px;text-align:center;border:1px solid var(--line)}
.pipe b{display:block;font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.pipe span{font-size:10.5px;color:var(--muted)}
.soon{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;background:linear-gradient(180deg,var(--gold-soft),transparent 70%)}
.soon ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:transparent;pointer-events:none}
nav .in{pointer-events:auto;width:100%;max-width:480px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;font-weight:600;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] svg{color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
.foot{font-size:11.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease}}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

<script>

let DATA={plan:[],board:[],tickets:[],snap:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let TODAY=iso(new Date());
const add=(s,n)=>{const p=s.split("-").map(Number);const d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return d.toISOString().slice(0,10)};
const WD=["CN","T2","T3","T4","T5","T6","T7"],WDL=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
const wd=s=>{const p=s.split("-").map(Number);return WD[new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()]};
const dm=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toUpperCase();
const AGN={MAY:"Maytrip",HV:"Hoàng Việt",HANO:"Hanotour",ANZ:"ANZ",VON:"Viona",GON:"Golden Tour",LONA:"Lona Tour"};
const agName=p=>AGN[p.key]||p.agency;
const isSun=p=>/sun/i.test(p.series||"");
/* visa milestones: recv −12 · submit −10 · visa −4 */
const ms=p=>({recv:add(p.dep,-12),sub:add(p.dep,-10),visa:add(p.dep,-4)});
function link(p){const din=p.din||add(p.dep,1),k=norm(p.key),c=norm(p.code);
  const m=DATA.board.filter(r=>{const h=norm(r.code+" "+r.team);return h.includes(c)||(r.dIn===din&&k&&h.includes(k))});return m.length===1?m[0]:null}
function state(p){const r=link(p);const st=r?(r.status||"moi"):"";const vs=r?"":(p.vstat||"");
  let recv=(!!r&&((r.n||0)>0||["xuat","nop","visa"].includes(st)))||["nhan","nop","visa"].includes(vs);
  let sub=(!!r&&(!!r.submittedAt||["nop","visa"].includes(st)))||["nop","visa"].includes(vs);
  const visa=(!!r&&st==="visa")||vs==="visa";
  if(visa)sub=true;if(sub)recv=true;
  const k=p.cancel?"huy":visa?"visa":sub?"nop":recv?"nhan":"cho";return {recv,sub,visa,k}}
const ST={cho:["Chờ hồ sơ","p-grey"],nhan:["Đã nhận HS","p-amber"],nop:["Đã nộp","p-jade"],visa:["Có visa","p-ok"],huy:["Huỷ","p-grey"]};
let live=[];
function tasks(){const out=[];
  live.forEach(p=>{const s=state(p),m=ms(p);if(p.dep<TODAY)return;
    if(!s.recv)out.push({date:m.recv,what:"Nhận hồ sơ visa",p});
    if(!s.sub)out.push({date:m.sub,what:"Nộp visa",p});
    if(!s.visa)out.push({date:m.visa,what:"Hạn có visa",p,hard:true});
    out.push({date:p.dep,what:"Đoàn bay",p,fly:true})});
  const lbl=["Kiểm tra SL","Cọc 1","Cọc 2","Cọc 3","Vào tên","Xuất vé"],dk=[0,null,1,2,3,4];
  DATA.tickets.forEach(t=>{if((t.cancel||/huỷ|hủy/i.test(t.note)))return;lbl.forEach((l,i)=>{const di=dk[i];if(di==null||t.done[i])return;const d=t.due[di];if(d)out.push({date:d,what:/vé$/.test(l)?l:l+" vé",t})})});
  return out.sort((a,b)=>a.date.localeCompare(b.date))}
function row(x){const d=x.date,late=d<TODAY&&!x.fly;
  let t,m,pill;
  if(x.t){t=x.t.code;m=`${x.t.h} · ${x.t.seats||0} vé${x.t.pax?` · ${x.t.pax} khách`:""} · bay ${dm(x.t.dep)}`}
  else{t=x.p.code;m=esc(agName(x.p))+(x.p.route?" · "+esc(x.p.route).slice(0,48):"")}
  pill=x.fly?`<span class="pill p-gold">Bay</span>`:late?`<span class="pill p-red">Trễ</span>`:d===TODAY?`<span class="pill p-amber">Hôm nay</span>`:"";
  return `<div class="it"><div class="d"><b>${d.slice(8,10)}</b><span>${wd(d)} T${+d.slice(5,7)}</span></div><div style="min-width:0"><div class="t">${esc(x.what)} · ${esc(t)}</div><div class="m">${m}</div></div>${pill}</div>`}
function vHomnay(){const T=tasks();const in7=add(TODAY,7);
  const late=T.filter(x=>x.date<TODAY&&!x.fly&&(x.t||x.p.dep>=TODAY));const today=T.filter(x=>x.date===TODAY);const week=T.filter(x=>x.date>TODAY&&x.date<=in7);
  const fly7=live.filter(p=>p.dep>=TODAY&&p.dep<=in7).length+DATA.tickets.filter(t=>t.dep>=TODAY&&t.dep<=in7&&!(t.cancel||/huỷ|hủy/i.test(t.note))&&!live.some(p=>p.dep===t.dep&&norm(p.code).includes(norm(t.code))) ).length;
  const lim=a=>a.slice(0,12).map(row).join("")+(a.length>12?`<div class="it"><div></div><div class="m">và ${a.length-12} việc nữa</div><div></div></div>`:"");
  const va=DATA.visaAt?new Date(DATA.visaAt):null;const hrs=va?(Date.now()-va)/36e5:999;
  const stale=hrs>6?`<section class="soon" style="border-color:var(--seal);background:var(--seal-soft)"><h2 style="font-size:16px;color:var(--seal)">⚠ Kế hoạch & visa chưa cập nhật ${va?Math.round(hrs)+" giờ":""}</h2><p style="margin:0;font-size:13.5px;color:var(--ink)">Lần đồng bộ cuối: ${va?va.toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}):"chưa có"}. Các việc "trễ" dưới đây có thể đã làm xong. Trên máy tính, mở Trung tâm Điều hành → bấm nút đỏ <b>📱 Đồng bộ app</b>, rồi bấm Tải lại ở đây.</p></section>`:"";
  return stale+`<section class="stats"><div class="stat ${late.length?"red":""}"><b>${late.length}</b><span>Việc quá hạn</span></div><div class="stat gold"><b>${today.length}</b><span>Việc hôm nay</span></div><div class="stat"><b>${fly7}</b><span>Đoàn bay 7 ngày</span></div></section>
  <section class="sec"><div class="sec-h"><h2>Hôm nay</h2><span class="small">${today.length} việc</span></div>${today.length?`<div class="list">${lim(today)}</div>`:`<div class="empty">Hôm nay không có việc đến hạn.</div>`}</section>
  ${late.length?`<section class="sec"><div class="sec-h"><h2 style="color:var(--seal)">Quá hạn</h2><span class="small">đoàn chưa bay</span></div><div class="list">${lim(late)}</div></section>`:""}
  <section class="sec"><div class="sec-h"><h2>7 ngày tới</h2><span class="small">${week.length} việc</span></div>${week.length?`<div class="list">${lim(week)}</div>`:`<div class="empty">Không có việc trong 7 ngày tới.</div>`}</section>`}
let SER="sun",OPEN="";
function vSeries(){const grp={};live.concat(DATA.plan.filter(p=>p.cancel)).forEach(p=>{if((SER==="sun")!==isSun(p))return;(grp[p.key]=grp[p.key]||[]).push(p)});
  const keys=Object.keys(grp).sort((a,b)=>grp[b].length-grp[a].length);
  const up=p=>!p.cancel&&p.dep>=TODAY;
  const cards=keys.map(k=>{const L=grp[k].sort((a,b)=>a.dep.localeCompare(b.dep));const U=L.filter(up);const S={cho:0,nhan:0,nop:0,visa:0};U.forEach(p=>S[state(p).k]++);
    const tot=U.length||1;const next=U[0];

    for(const it of items){const d=Math.hypot(it.x-mx,it.y-my);const target=d<R?Math.pow(1-d/R,1.4):0;it.g=Math.max(target,it.g*0.94);if(it.g<0.01)it.g=0;if(it.g>0)live=true}
    draw();if(live||now-lastMove<200)raf=requestAnimationFrame(tick);
  }
  function kick(){if(!raf&&!reduce)raf=requestAnimationFrame(tick)}
  if(!reduce){
    const mv=e=>{mx=e.clientX;my=e.clientY;lastMove=performance.now();kick()};
    addEventListener("pointermove",mv,{passive:true});addEventListener("pointerdown",mv,{passive:true});
    addEventListener("touchmove",e=>{const t=e.touches[0];if(t)mv({clientX:t.clientX,clientY:t.clientY})},{passive:true});
    addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")setTimeout(()=>{mx=my=-1e4;kick()},600)});
    document.addEventListener("pointerleave",()=>{mx=my=-1e4;kick()});
    if(!fine){let sw=0;const sweep=()=>{const t0=performance.now(),y0=H*(0.25+Math.random()*0.5);const step=()=>{const k=(performance.now()-t0)/2600;if(k>1){mx=my=-1e4;kick();return}mx=-60+k*(W+120);my=y0+Math.sin(k*3.1)*60;lastMove=performance.now();kick();sw=requestAnimationFrame(step)};step()};setTimeout(sweep,900);setInterval(()=>{if(document.visibilityState==="visible")sweep()},9000)}
  }
  let rt=0;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(layout,150)});
  window.__motifRefresh=()=>{readColors();draw()};
  readColors();layout();
})();

</script>
